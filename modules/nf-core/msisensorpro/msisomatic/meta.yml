name: msisensorpro_msisomatic
description: MSIsensor-pro evaluates Microsatellite Instability (MSI) for cancer
  patients with next generation sequencing data. It accepts the whole genome
  sequencing, whole exome sequencing and target region (panel) sequencing data
  as input
keywords:
  - micro-satellite-scan
  - msisensor-pro
  - msi
  - somatic
tools:
  - msisensorpro:
      description: Microsatellite Instability (MSI) detection using
        high-throughput sequencing data.
      homepage: https://github.com/xjtu-omics/msisensor-pro
      documentation: https://github.com/xjtu-omics/msisensor-pro/wiki
      tool_dev_url: https://github.com/xjtu-omics/msisensor-pro
      doi: "10.1016/j.gpb.2020.02.001"
      licence:
        - "Custom Licence"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - normal:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - normal_index:
        type: file
        description: BAM/CRAM/SAM index file
        pattern: "*.{bai,crai,sai}"
        ontologies: []
    - tumor:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - tumor_index:
        type: file
        description: BAM/CRAM/SAM index file
        pattern: "*.{bai,crai,sai}"
        ontologies: []
    - intervals:
        type: file
        description: bed file containing interval information, optional
        pattern: "*.{bed}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing genome information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: Reference genome
        pattern: "*.{fasta}"
        ontologies: []
  - msisensor_scan:
      type: file
      description: Output from msisensor-pro/scan, containing list of msi regions
      pattern: "*.list"
      ontologies: []
output:
  output_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}:
          type: file
          description: File containing final report with all detected
            microsatellites, unstable somatic microsatellites, msi score
          ontologies: []
  output_dis:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}_dis:
          type: file
          description: File containing distribution results
          ontologies: []
  output_all:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}_all:
          type: file
          description: File containing the per-site test results (difference,
            P value, FDR) for all evaluated microsatellites
          ontologies: []
  output_unstable:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}_unstable:
          type: file
          description: File containing the unstable (somatic MSI) sites; only
            the header line if no site is unstable
          ontologies: []
  versions_msisensorpro:
    - - ${task.process}:
          type: string
          description: The name of the process
      - msisensor-pro:
          type: string
          description: The name of the tool
      - msisensor-pro --version 2>&1 | sed -nE 's/Version:\s*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - msisensor-pro:
          type: string
          description: The name of the tool
      - msisensor-pro --version 2>&1 | sed -nE 's/Version:\s*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@FriederikeHanssen"
maintainers:
  - "@FriederikeHanssen"
