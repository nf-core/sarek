name: gatk4_haplotypecaller
description: Call germline SNPs and indels via local re-assembly of haplotypes
keywords:
  - gatk4
  - haplotype
  - haplotypecaller
tools:
  - gatk4:
      description: |
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: "10.1101/gr.107524.110"
      publication:
        author: "McKenna, A., Hanna, M., Banks, E., Sivachenko, A., Cibulskis, K., Kernytsky, A., Garimella, K., Altshuler, D., Gabriel, S., Daly, M. & DePristo, M. A."
        year: 2010
        title: "The Genome Analysis Toolkit: A MapReduce framework for analyzing next-generation DNA sequencing data"
        source: "Genome Research"
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: BAM/CRAM file from alignment
        pattern: "*.{bam,cram}"
        ontologies: []
    - input_index:
        type: file
        description: BAI/CRAI file from alignment
        pattern: "*.{bai,crai}"
        ontologies: []
    - intervals:
        type: file
        description: Bed file with the genomic regions included in the library (optional)
        ontologies: []
    - dragstr_model:
        type: file
        description: Text file containing the DragSTR model of the used BAM/CRAM file (optional)
        pattern: "*.txt"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test_reference' ]
    - fasta:
        type: file
        description: The reference fasta file
        pattern: "*.fasta"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test_reference' ]
    - fai:
        type: file
        description: Index of reference fasta file
        pattern: "fasta.fai"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test_reference' ]
    - dict:
        type: file
        description: GATK sequence dictionary
        pattern: "*.dict"
        ontologies: []
  - - meta5:
        type: map
        description: |
          Groovy Map containing dbsnp information
          e.g. [ id:'test_dbsnp' ]
    - dbsnp:
        type: file
        description: VCF file containing known sites (optional)
        ontologies: []
  - - meta6:
        type: map
        description: |
          Groovy Map containing dbsnp information
          e.g. [ id:'test_dbsnp' ]
    - dbsnp_tbi:
        type: file
        description: VCF index of dbsnp (optional)
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.vcf.gz":
          type: file
          description: Compressed VCF file
          pattern: "${prefix}.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "${prefix}.vcf.gz.tbi":
          type: file
          description: Index of VCF file
          pattern: "${prefix}.vcf.gz.tbi"
          ontologies: []
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.realigned.bam":
          type: file
          description: Assembled haplotypes and locally realigned reads
          pattern: "*.realigned.bam"
          ontologies: []
  bai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.realigned.bai":
          type: file
          description: Index of the realigned BAM file (written by GATK when `--bam-writer-type` is set and BAM index creation is enabled, which is the default)
          pattern: "*.realigned.bai"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@suzannejin"
  - "@FriederikeHanssen"
maintainers:
  - "@suzannejin"
  - "@FriederikeHanssen"
