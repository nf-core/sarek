name: bedtools_sort
description: Sorts a feature file by chromosome and other criteria.
keywords:
  - bed
  - sort
  - bedtools
  - chromosome
tools:
  - bedtools:
      description: |
        A set of tools for genomic analysis tasks, specifically enabling genome arithmetic (merge, count, complement) on various file types.
      documentation: https://bedtools.readthedocs.io/en/latest/content/tools/sort.html
      licence: ["MIT"]
      identifier: biotools:bedtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - intervals:
        type: file
        description: BED/BEDGRAPH
        pattern: "*.{bed|bedGraph}"
        ontologies: []
  - genome_file:
      type: file
      description: |
        Optional reference genome 2 column file that defines the expected chromosome order.
      pattern: "*.{fai,txt,chromsizes}"
      ontologies: []
  - suffix:
      type: string
      description: |
        Extension of the output file (e.g. "bed", "bam", "txt"), which depends on the arguments used.
        If empty, the extension of intervals1 is used.
output:
  sorted:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.${extension}":
          type: file
          description: Sorted output file
          pattern: "*.${extension}"
          ontologies: []
  versions_bedtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bedtools:
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bedtools:
          type: string
          description: The name of the tool
      - "bedtools --version | sed -e 's/bedtools v//g'":
          type: eval
          description: The expression to obtain the version of the tool
