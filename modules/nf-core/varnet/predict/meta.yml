name: "varnet_predict"
description: Scores candidate somatic variants with VarNet's neural network and writes
  a VCF. This is the second of VarNet's two stages; it consumes the candidates emitted
  by varnet/filter.
keywords:
  - variant calling
  - machine learning
  - neural network
  - somatic
tools:
  - "varnet":
      description: "A deep learning-based somatic variant caller"
      homepage: "https://github.com/skandlab/VarNet"
      documentation: "https://github.com/skandlab/VarNet"
      tool_dev_url: "https://github.com/skandlab/VarNet"
      doi: "10.1038/s41467-022-31765-8"
      licence:
        - "PolyForm Noncommercial License 1.0.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input_tumor:
        type: file
        description: BAM file from tumor sample
        pattern: "*.bam"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
    - index_tumor:
        type: file
        description: Index of tumor BAM file
        pattern: "*.bai"
        ontologies:
          - edam: http://edamontology.org/format_3327 # BAI
    - input_normal:
        type: file
        description: BAM file from matched normal sample (required; tumor-only mode is not supported)
        pattern: "*.bam"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
    - index_normal:
        type: file
        description: Index of normal BAM file
        pattern: "*.bai"
        ontologies:
          - edam: http://edamontology.org/format_3327 # BAI
    - candidates:
        type: directory
        description: Candidates directory emitted by varnet/filter, holding snvs/Positions.csv
          and indels/Positions.csv
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
    - fasta:
        type: file
        description: The reference fasta file
        pattern: "*.{fasta,fa}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
    - fai:
        type: file
        description: Index of reference fasta file
        pattern: "*.fai"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}/${prefix}.vcf.gz:
          type: file
          description: Compressed VCF file
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3016 # VCF
            - edam: http://edamontology.org/format_3989 # GZIP format

  predictions:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}/predictions:
          type: directory
          description: Directory of per-variant model predictions, holding snvs/Predictions.csv
            and indels/Predictions.csv

  versions_varnet:
    - - ${task.process}:
          type: string
          description: The name of the process
      - varnet:
          type: string
          description: The name of the tool
      - "1.5.3":
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - varnet:
          type: string
          description: The name of the tool
      - "1.5.3":
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@kiranchari"
maintainers:
  - "@kiranchari"
