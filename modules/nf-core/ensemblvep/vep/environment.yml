channels:
  - conda-forge
  - bioconda
dependencies:
  # renovate: datasource=conda depName=bioconda/ensembl-vep
  - bioconda::ensembl-vep=116.3
  # renovate: datasource=conda depName=bioconda/perl-math-cdf
  - bioconda::perl-math-cdf=0.1
