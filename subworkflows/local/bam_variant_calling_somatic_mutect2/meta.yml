name: gatk_tumor_normal_somatic_variant_calling
description: |
  Perform variant calling on a paired tumor normal set of samples using mutect2 tumor normal mode, scattered over intervals.
  Calls, stats and f1r2 files are merged across intervals and filtered with BAM_VCF_FILTER_MUTECT_CALLS_GATK
  (learnreadorientationmodel, getpileupsummaries and calculatecontamination when a germline resource is provided, filtermutectcalls).
keywords:
  - gatk4
  - mutect2
  - learnreadorientationmodel
  - getpileupsummaries
  - calculatecontamination
  - filtermutectcalls
  - variant_calling
  - tumor_normal
  - filtered_vcf
modules:
  - gatk4/mutect2
  - gatk4/mergevcfs
  - gatk4/mergemutectstats
  - bam_vcf_filter_mutect_calls_gatk
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test' ]
  - input:
      type: list
      description: list containing the normal and tumor BAM files, in that order, also able to take CRAM as an input
      pattern: "[ *.{bam/cram} ]"
  - input_index:
      type: list
      description: list containing the normal and tumor BAM file indexes, in that order, also able to take CRAM index as an input
      pattern: "[ *.{bam.bai/cram.crai} ]"
  - which_norm:
      type: list
      description: optional list of sample headers contained in the normal sample input file.
      pattern: "testN"
  - fasta:
      type: file
      description: The reference fasta file
      pattern: "*.fasta"
  - fai:
      type: file
      description: Index of reference fasta file
      pattern: "*.fasta.fai"
  - dict:
      type: file
      description: GATK sequence dictionary
      pattern: "*.dict"
  - germline_resource:
      type: file
      description: Population vcf of germline sequencing, containing allele fractions.
      pattern: "*.vcf.gz"
  - germline_resource_tbi:
      type: file
      description: Index file for the germline resource.
      pattern: "*.vcf.gz.tbi"
  - panel_of_normals:
      type: file
      description: vcf file to be used as a panel of normals.
      pattern: "*.vcf.gz"
  - panel_of_normals_tbi:
      type: file
      description: Index for the panel of normals.
      pattern: "*.vcf.gz.tbi"
  - interval_file:
      type: file
      description: File containing intervals.
      pattern: "*.interval_list"
  - joint_mutect2:
      type: boolean
      description: Run mutect2 in joint mode, calling all samples of a patient together.
  - germline_resource_provided:
      type: boolean
      description: Whether a germline resource was provided, which enables contamination estimation before filtering.
output:
  - vcf:
      type: file
      description: |
        Filtered VCF
        Structure: [ val(meta), path(file) ]
      pattern: "*.filtered.vcf.gz"
  - tbi:
      type: file
      description: |
        Index of the filtered VCF
        Structure: [ val(meta), path(file) ]
      pattern: "*.filtered.vcf.gz.tbi"
  - stats_filtered:
      type: file
      description: |
        FilterMutectCalls statistics
        Structure: [ val(meta), path(file) ]
      pattern: "*.filteringStats.tsv"
  - artifact_priors:
      type: file
      description: |
        Read-orientation artefact priors
        Structure: [ val(meta), path(file) ]
      pattern: "*.artifactprior.tar.gz"
  - pileup_table_normal:
      type: file
      description: |
        Pileup summary table of the normal (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.pileups.table"
  - pileup_table_tumor:
      type: file
      description: |
        Pileup summary table of the tumour (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.pileups.table"
  - contamination_table:
      type: file
      description: |
        Contamination table (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.contamination.table"
  - segmentation_table:
      type: file
      description: |
        Tumour segmentation table (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.segmentation.table"
authors:
  - "@GCJMackenzie"
