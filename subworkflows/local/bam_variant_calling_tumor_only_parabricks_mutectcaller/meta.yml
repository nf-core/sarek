# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_variant_calling_tumor_only_parabricks_mutectcaller"
description: |
  Perform tumor-only somatic variant calling using the Parabricks GPU-accelerated mutectcaller
  (a GPU port of GATK Mutect2), run as a single job per sample on the combined intervals
  (no scatter/gather), optionally with a panel of normals. No matched normal sample is used.
  The bgzip-compressed output VCF is linked under its final name and indexed (not
  re-compressed) with htslib/bgziptabix. The raw (unfiltered) calls are emitted.
  Contamination estimation and filtermutectcalls are not run by this subworkflow.
  f1r2 / read-orientation filtering (learnreadorientationmodel) and the germline resource prior
  during calling are not wired up, because the nf-core parabricks/mutectcaller module does not
  expose them yet.
keywords:
  - parabricks
  - mutectcaller
  - mutect2
  - somatic
  - variant_calling
  - tumor_only
  - gpu
components:
  - parabricks/mutectcaller
  - htslib/bgziptabix
input:
  - cram:
      type: list
      description: |
        Tumor BAM/CRAM file with its index.
        Structure: [ val(meta), path(tumour_cram), path(tumour_crai) ]
      pattern: "*.{bam,bai,cram,crai}"
  - fasta:
      type: file
      description: |
        Reference FASTA file.
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}"
  - fasta_fai:
      type: file
      description: |
        Index of the reference FASTA file.
        Structure: [ val(meta), path(fasta_fai) ]
      pattern: "*.fai"
  - panel_of_normals:
      type: file
      description: |
        Panel of normals VCF used by the Parabricks mutectcaller.
        Structure: [ path(panel_of_normals) ] or []
      pattern: "*.vcf.gz"
  - panel_of_normals_tbi:
      type: file
      description: |
        Index of the panel of normals VCF.
        Structure: [ path(panel_of_normals_tbi) ] or []
      pattern: "*.vcf.gz.tbi"
  - intervals_bed_combined:
      type: file
      description: |
        Single combined BED file of target regions, or [] when running without intervals.
        Structure: [ path(intervals) ] or []
      pattern: "*.bed"
output:
  - vcf:
      type: file
      description: |
        Raw (unfiltered) somatic variant calls, with variantcaller: 'parabricks_mutectcaller' added to meta.
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.parabricks_mutectcaller.vcf.gz"
  - tbi:
      type: file
      description: |
        Index of the raw VCF, with variantcaller: 'parabricks_mutectcaller' added to meta.
        Structure: [ val(meta), path(tbi) ]
      pattern: "*.parabricks_mutectcaller.vcf.gz.tbi"
  - stats:
      type: file
      description: |
        Mutect stats produced by the Parabricks mutectcaller (input for filtermutectcalls).
        Structure: [ val(meta), path(stats) ]
      pattern: "*.vcf.gz.stats"
authors:
  - "@JoeSaelens"
maintainers:
  - "@JoeSaelens"
