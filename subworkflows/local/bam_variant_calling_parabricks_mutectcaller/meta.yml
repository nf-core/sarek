# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_variant_calling_parabricks_mutectcaller"
description: |
  Perform somatic variant calling on paired tumour-normal or tumour-only samples with the
  Parabricks GPU-accelerated mutectcaller, run as a single job per pair or sample on the combined
  intervals, optionally with a panel of normals. The calls are filtered on CPU with GATK
  filtermutectcalls, using contamination and segmentation tables from getpileupsummaries and
  calculatecontamination when a germline resource is provided. Read-orientation filtering and the
  germline prior during calling are not available, as the parabricks/mutectcaller module does not
  expose them.
keywords:
  - parabricks
  - mutectcaller
  - mutect2
  - somatic
  - variant_calling
  - tumor_normal
  - tumor_only
  - getpileupsummaries
  - calculatecontamination
  - filtermutectcalls
  - filtered_vcf
  - gpu
components:
  - parabricks/mutectcaller
  - gatk4/getpileupsummaries
  - gatk4/calculatecontamination
  - gatk4/filtermutectcalls
input:
  - cram:
      type: list
      description: |
        Normal and tumour BAM/CRAM files with their indexes. The normal file and index are [] for tumour-only.
        Structure: [ val(meta), path(normal_cram), path(normal_crai), path(tumour_cram), path(tumour_crai) ]
      pattern: "*.{bam,bai,cram,crai}"
  - fasta:
      type: file
      description: |
        Reference FASTA file.
        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}"
  - fasta_fai:
      type: file
      description: |
        Index of the reference FASTA file.
        Structure: [ val(meta), path(fasta_fai) ]
      pattern: "*.fai"
  - dict:
      type: file
      description: |
        GATK sequence dictionary of the reference FASTA file (used by the GATK4 modules).
        Structure: [ val(meta), path(dict) ]
      pattern: "*.dict"
  - germline_resource:
      type: file
      description: |
        Population VCF of germline sequencing containing allele fractions, used by getpileupsummaries.
        Pass [] to skip getpileupsummaries and calculatecontamination.
        Structure: [ path(germline_resource) ] or []
      pattern: "*.vcf.gz"
  - germline_resource_tbi:
      type: file
      description: |
        Index of the germline resource VCF.
        Structure: [ path(germline_resource_tbi) ] or []
      pattern: "*.vcf.gz.tbi"
  - panel_of_normals:
      type: file
      description: |
        Panel of normals VCF used by the Parabricks mutectcaller.
        Structure: [ path(panel_of_normals) ] or []
      pattern: "*.vcf.gz"
  - panel_of_normals_tbi:
      type: file
      description: |
        Index of the panel of normals VCF.
        Structure: [ path(panel_of_normals_tbi) ] or []
      pattern: "*.vcf.gz.tbi"
  - intervals_bed_combined:
      type: file
      description: |
        Single combined BED file of target regions, or [] when running without intervals.
        Structure: [ path(intervals) ] or []
      pattern: "*.bed"
output:
  - vcf:
      type: file
      description: |
        Somatic variant calls filtered by filtermutectcalls, with variantcaller: 'parabricks_mutectcaller' added to meta.
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.filtered.vcf.gz"
  - tbi:
      type: file
      description: |
        Index of the filtered VCF, with variantcaller: 'parabricks_mutectcaller' added to meta.
        Structure: [ val(meta), path(tbi) ]
      pattern: "*.filtered.vcf.gz.tbi"
  - stats:
      type: file
      description: |
        Mutect stats produced by the Parabricks mutectcaller, used by filtermutectcalls.
        Structure: [ val(meta), path(stats) ]
      pattern: "*.vcf.gz.stats"
  - stats_filtered:
      type: file
      description: |
        Filtering statistics produced by filtermutectcalls.
        Structure: [ val(meta), path(stats) ]
      pattern: "*.filteringStats.tsv"
  - contamination_table:
      type: file
      description: |
        Contamination table produced by calculatecontamination (empty channel without germline resource).
        Structure: [ val(meta), path(table) ]
      pattern: "*.contamination.table"
  - segmentation_table:
      type: file
      description: |
        Tumour segmentation table produced by calculatecontamination (empty channel without germline resource).
        Structure: [ val(meta), path(table) ]
      pattern: "*.segmentation.table"
  - pileup_table_normal:
      type: file
      description: |
        Pileup summary table of the normal sample (empty channel without germline resource or in tumour-only mode).
        Structure: [ val(meta), path(table) ]
      pattern: "*.pileups.table"
  - pileup_table_tumor:
      type: file
      description: |
        Pileup summary table of the tumour sample (empty channel without germline resource).
        Structure: [ val(meta), path(table) ]
      pattern: "*.pileups.table"
authors:
  - "@JoeSaelens"
maintainers:
  - "@JoeSaelens"
