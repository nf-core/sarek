name: bam_variant_calling_mutect2
description: |
  Perform variant calling with mutect2 on tumour-normal pairs or tumour-only samples, scattered over intervals.
  Calls, stats and f1r2 files are merged across intervals and filtered with VCF_VARIANT_FILTERING_MUTECT2
  (learnreadorientationmodel, getpileupsummaries and calculatecontamination when a germline resource is provided, filtermutectcalls).
keywords:
  - gatk4
  - mutect2
  - learnreadorientationmodel
  - getpileupsummaries
  - calculatecontamination
  - filtermutectcalls
  - variant_calling
  - tumor_normal
  - tumor_only
  - filtered_vcf
modules:
  - gatk4/mutect2
  - gatk4/mergevcfs
  - gatk4/mergemutectstats
  - vcf_variant_filtering_mutect2
input:
  - cram:
      type: list
      description: |
        One row per tumour-normal pair or tumour-only sample, the normal is [] for tumour-only
        Structure: [ val(meta), path(normal_cram), path(normal_crai), path(tumor_cram), path(tumor_crai) ]
  - fasta:
      type: file
      description: The reference fasta file
      pattern: "*.fasta"
  - fai:
      type: file
      description: Index of reference fasta file
      pattern: "*.fasta.fai"
  - dict:
      type: file
      description: GATK sequence dictionary
      pattern: "*.dict"
  - force_call_alleles:
      type: file
      description: VCF of alleles that Mutect2 force-calls in addition to the variants it discovers (--alleles).
      pattern: "*.vcf.gz"
  - force_call_alleles_tbi:
      type: file
      description: Index file for the force-call alleles VCF.
      pattern: "*.vcf.gz.tbi"
  - germline_resource:
      type: file
      description: Population vcf of germline sequencing, containing allele fractions.
      pattern: "*.vcf.gz"
  - germline_resource_tbi:
      type: file
      description: Index file for the germline resource.
      pattern: "*.vcf.gz.tbi"
  - contamination_resource:
      type: file
      description: VCF of common biallelic germline SNPs with population allele frequencies, used by getpileupsummaries.
      pattern: "*.vcf.gz"
  - contamination_resource_tbi:
      type: file
      description: Index file for the contamination resource.
      pattern: "*.vcf.gz.tbi"
  - panel_of_normals:
      type: file
      description: vcf file to be used as a panel of normals.
      pattern: "*.vcf.gz"
  - panel_of_normals_tbi:
      type: file
      description: Index for the panel of normals.
      pattern: "*.vcf.gz.tbi"
  - interval_file:
      type: file
      description: File containing intervals.
      pattern: "*.interval_list"
  - joint_mutect2:
      type: boolean
      description: Run mutect2 in joint mode, calling all samples of a patient together.
  - contamination_resource_provided:
      type: boolean
      description: Whether a contamination resource was provided, which enables contamination estimation before filtering.
output:
  - vcf:
      type: file
      description: |
        Filtered VCF
        Structure: [ val(meta), path(file) ]
      pattern: "*.filtered.vcf.gz"
  - tbi:
      type: file
      description: |
        Index of the filtered VCF
        Structure: [ val(meta), path(file) ]
      pattern: "*.filtered.vcf.gz.tbi"
  - stats_filtered:
      type: file
      description: |
        FilterMutectCalls statistics
        Structure: [ val(meta), path(file) ]
      pattern: "*.filteringStats.tsv"
  - artifact_priors:
      type: file
      description: |
        Read-orientation artefact priors
        Structure: [ val(meta), path(file) ]
      pattern: "*.artifactprior.tar.gz"
  - pileup_table_normal:
      type: file
      description: |
        Pileup summary table of the normal (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.pileups.table"
  - pileup_table_tumor:
      type: file
      description: |
        Pileup summary table of the tumour (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.pileups.table"
  - contamination_table:
      type: file
      description: |
        Contamination table (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.contamination.table"
  - segmentation_table:
      type: file
      description: |
        Tumour segmentation table (only with a germline resource)
        Structure: [ val(meta), path(file) ]
      pattern: "*.segmentation.table"
authors:
  - "@GCJMackenzie"
