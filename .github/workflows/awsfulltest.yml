name: nf-core AWS full size tests (dev CPU trial)

on:
  pull_request_review:
    types: [submitted]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      somatic:
        description: "Somatic full test"
        type: boolean
        default: false
      germline:
        description: "Germline full test"
        type: boolean
        default: false
      germline_ncbench_agilent:
        description: "Germline Agilent NCBench test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Build test matrix
    if: github.repository == 'nf-core/sarek' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Build matrix from inputs
        id: build-matrix
        run: |
          all='[
            {
              "profile": "test_full_aws",
              "test": "somatic"
            },
            {
              "profile": "test_full_germline_aws",
              "test": "germline"
            },
            {
              "profile": "test_full_germline_ncbench_agilent",
              "test": "germline_ncbench_agilent"
            }
          ]'

          matrix=$(echo "$all" | jq -c '[.[] | select(
            (.test == "somatic" and ${{ inputs.somatic }}) or
            (.test == "germline" and ${{ inputs.germline }}) or
            (.test == "germline_ncbench_agilent" and ${{ inputs.germline_ncbench_agilent }})
          )]')

          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  run-platform:
    needs: setup-matrix
    if: fromJson(needs.setup-matrix.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    name: Run ${{ matrix.profile }}
    runs-on: ubuntu-latest
    steps:
      - name: Check dev trial configuration
        env:
          SEQERA_TOKEN: ${{ secrets.SAREK_DEV_TOWER_ACCESS_TOKEN }}
          SEQERA_WORKSPACE_ID: ${{ vars.SAREK_DEV_WORKSPACE_ID }}
          SEQERA_COMPUTE_ENV_ID: ${{ vars.SAREK_DEV_CPU_COMPUTE_ENV_ID }}
          BUCKET_PREFIX: ${{ vars.SAREK_DEV_BUCKET_PREFIX }}
        run: |
          : "${SEQERA_TOKEN:?Set the SAREK_DEV_TOWER_ACCESS_TOKEN repository secret}"
          : "${SEQERA_WORKSPACE_ID:?Set the SAREK_DEV_WORKSPACE_ID repository variable}"
          : "${SEQERA_COMPUTE_ENV_ID:?Set the SAREK_DEV_CPU_COMPUTE_ENV_ID repository variable}"
          : "${BUCKET_PREFIX:?Set the SAREK_DEV_BUCKET_PREFIX repository variable}"

      - name: Launch workflow via Seqera Platform
        id: tower-launch
        uses: seqeralabs/action-seqera-launch@f7b1a39afc8bb65f58b84150cd214b33fe416fef #v1
        with:
          wait: completion
          run-name: sarek_dev_${{ matrix.profile }}
          workspace-id: ${{ vars.SAREK_DEV_WORKSPACE_ID }}
          access-token: ${{ secrets.SAREK_DEV_TOWER_ACCESS_TOKEN }}
          compute-env-id: ${{ vars.SAREK_DEV_CPU_COMPUTE_ENV_ID }}
          revision: ${{ github.sha }}
          work-dir: ${{ vars.SAREK_DEV_BUCKET_PREFIX }}/work/sarek/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.profile }}
          parameters: |
            {
              "outdir": "${{ vars.SAREK_DEV_BUCKET_PREFIX }}/results/sarek/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.profile }}/"
            }
          nextflow-config: |
            plugins {
              id 'nf-slack@0.5.0'
              id 'nf-schema@2.7.2'
            }
            slack {
              enabled = true
              bot {
                token = '${{ secrets.NFSLACK_BOT_TOKEN }}'
                channel = 'sarek_dev'
              }
              onStart {
                enabled = false
              }
              onComplete {
                message = ':white_check_mark: *sarek/${{ matrix.profile }}* completed successfully! :tada:'
              }
              onError {
                message = ':x: *sarek/${{ matrix.profile }}* failed :crying_cat_face:'
              }
            }
          profiles: ${{ matrix.profile }}
