name: nf-core AWS test
# This workflow can be triggered manually with the GitHub actions workflow dispatch button.
# It runs the -profile 'test' on AWS batch

on:
  workflow_dispatch:
jobs:
  run-platform:
    name: Run AWS tests
    if: github.repository == 'nf-core/sarek'
    runs-on: ubuntu-latest
    steps:
      - name: Launch workflow via Seqera Platform
        uses: seqeralabs/action-seqera-launch@f7b1a39afc8bb65f58b84150cd214b33fe416fef #v1
        with:
          wait: none
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: ${{ vars.TOWER_COMPUTE_ENV }}
          revision: ${{ github.sha }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}/work/sarek/work-${{ github.sha }}
          parameters: |
            {
              "outdir": "s3://${{ vars.AWS_S3_BUCKET }}/sarek/results-test-${{ github.sha }}"
            }
          profiles: test
