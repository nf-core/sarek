[tools]
"aqua:ast-grep/ast-grep" = "0.44.1"

[tasks.setup]
description = "Build and smoke-test the Nextflow parser"
run = [
    "bash setup-parser.sh",
    """printf 'workflow { channel.of(42).view() }' | ast-grep run -c sgconfig.yml -l nextflow -p 'channel.of($VALUE)' --stdin""",
]

[tasks.check]
description = "Test structural rules and scan first-party Nextflow code"
run = [
    "ast-grep test -c sgconfig.yml --skip-snapshot-tests",
    "ast-grep scan -c sgconfig.yml ../main.nf ../workflows ../subworkflows/local ../modules/local",
]
